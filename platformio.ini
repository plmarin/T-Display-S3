; Crypto Ticker - LilyGo T-Display S3
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Crypto-T-Display-S3

[env:Crypto-T-Display-S3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_filters =
	esp32_exception_decoder
	time
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D TDISPLAY_S3=1
	; TFT_eSPI config for the T-Display S3 (same as its User_Setups/Setup206_LilyGo_T_Display_S3.h)
	-D USER_SETUP_LOADED=1
	-D USER_SETUP_ID=206
	-D ST7789_DRIVER=1
	-D INIT_SEQUENCE_3=1
	-D CGRAM_OFFSET=1
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_INVERSION_ON=1
	-D TFT_PARALLEL_8_BIT=1
	-D TFT_WIDTH=170
	-D TFT_HEIGHT=320
	-D TFT_CS=6
	-D TFT_DC=7
	-D TFT_RST=5
	-D TFT_WR=8
	-D TFT_RD=9
	-D TFT_D0=39
	-D TFT_D1=40
	-D TFT_D2=41
	-D TFT_D3=42
	-D TFT_D4=45
	-D TFT_D5=46
	-D TFT_D6=47
	-D TFT_D7=48
	-D TFT_BL=38
	-D TFT_BACKLIGHT_ON=HIGH
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/takkaO/OpenFontRender
	bblanchon/ArduinoJson@^6.21.2
	https://github.com/tzapu/WiFiManager.git#v2.0.16-rc.2
	mathertel/OneButton @ ^2.0.3
